<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake and Ladder Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>Snake and Ladder Game</h1>
    
    <div class="game-board" id="gameBoard">
      <!-- Board will be generated by JavaScript -->
    </div>
    
    <div class="game-controls">
      <div class="dice" id="dice">
        <div class="dot" id="dot0"></div>
        <div class="dot" id="dot1"></div>
        <div class="dot" id="dot2"></div>
        <div class="dot" id="dot3"></div>
        <div class="dot" id="dot4"></div>
        <div class="dot" id="dot5"></div>
        <div class="dot" id="dot6"></div>
        <div class="dot" id="dot7"></div>
        <div class="dot" id="dot8"></div>
      </div>
      <button id="rollButton">Roll Dice</button>
      <p id="result">Roll the dice to start</p>
      <p id="position">You are at position: 1</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
